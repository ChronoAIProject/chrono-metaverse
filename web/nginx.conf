# 网站镜像的 nginx 配置：提供构建好的单页应用，并把接口同源转发给接口服务。
# 照 CMA web/nginx.conf 改写，去掉了 agent / event-gateway / image-manager 等 CMA 专有的路由。
#
# 同源是有意的：页面不需要知道接口在哪，分享令牌只放在请求头里（设计 7.2）。
# 接口服务的地址 metaverse-api:8080 由部署配置（infra/）里的服务名决定。

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 分享令牌在地址的 # 后面；不发 Referer，令牌不会随外链泄露（设计 7.2）。
    add_header Referrer-Policy "no-referrer" always;

    # 带哈希的静态文件永不变化；入口页面每次都重新取。
    location /assets/ {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types application/javascript text/javascript text/css;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri @missing_asset;
    }

    # 发布过程中短暂找不到的文件不能被缓存成空白页（同 CMA）。
    location @missing_asset {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # 注意：location 里一旦写了 add_header，就不再继承 server 级的 add_header，所以安全头要重写一遍。
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # 接口服务：公开读接口、写接口、管理接口、OpenAPI、健康检查都走同一个转发。
    # 分片上传每片最大 32MiB（设计 6.1、8.5），不在网站磁盘上缓冲请求体。
    location /api/ {
        client_max_body_size 33m;
        proxy_request_buffering off;
        proxy_pass http://metaverse-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 平台网关约 100 秒无响应就断开，长操作一律做成任务（设计 8.5）。
        proxy_read_timeout 100s;
    }

    # 接口说明文档也是接口，不能被单页应用的兜底路由吃掉。
    location = /openapi.json {
        proxy_pass http://metaverse-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 网站自己的健康检查（chrono-cd 探活用）。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 前端路由：/s/<空间编号>、/u/<组合编号> 等任何未匹配的路径都交给单页应用。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
