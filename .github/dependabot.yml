# 构建发布镜像的外部输入都固定到不可改写的引用（infra/chrono-cd/check-pins.mjs 检查），
# 由 Dependabot 每周提更新：
# - 工作流里的 action（固定到提交哈希，注释里是版本）；
# - 两个 Dockerfile 的基础镜像（标签@摘要）；
# - 本地重建工具（recon/）的锁定依赖（uv.lock；pyproject.toml 只写版本范围）。
# 处理服务已下线，它的镜像和构建后端两项已删。
# 新版本发布后先等一周再提，避开刚发布就被撤回或被替换的版本。合并前照常看变更说明。
# `# syntax=` 构建前端的摘要 Dependabot 不管，更新时手工取 docker/dockerfile:1 的新摘要。

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /infra/api
      - /infra/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # 接口服务的工具链版本和 api/rust-toolchain.toml、CI 一起手工改，这里只跟同一标签的新摘要。
      - dependency-name: rust
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  # 本地重建工具：uv 的锁文件（持续集成按 uv sync --frozen 装），一周的更新合成一个合并请求。
  - package-ecosystem: uv
    directory: /recon
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      recon:
        patterns: ['*']
