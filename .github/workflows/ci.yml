name: CI

# 每次推送和每个合并请求都跑：接口服务、网站（含夹具模式的端到端测试）、本地重建工具、命令行（目录存在时）
# 和仓库检查。跨服务的九步验收（infra/dev/e2e.mjs）要本地起全套并提供前厅扫描，不在这里跑。
# 写法参照 CMA 的 .github/workflows/ci.yml，按本项目的规模收缩。
#
# 第三方 action 一律固定到完整提交哈希（注释里是对应的版本），由 Dependabot 提更新
# （.github/dependabot.yml）；仓库检查里的 check-pins.mjs 拒绝标签和分支引用。

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: 接口服务（api）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # 集成测试连本 job 起的副本集；每个测试用独立的随机库，结束时删除。
      METAVERSE_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: 起 MongoDB 副本集
        working-directory: .
        run: bash .github/scripts/start-mongo.sh
      # 与 api/rust-toolchain.toml 一致。
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master，2026-11-09
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: api
      - name: 格式
        run: cargo fmt --all --check
      - name: 静态检查
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: 测试
        run: cargo test --workspace --locked
      - name: 数据访问边界（repo/ 以外不访问数据库）
        run: cargo test -p metaverse-api --locked --lib repo::tests::only_repo_touches_the_database -- --exact

  api-deny:
    name: 接口服务依赖审查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master，2026-11-09
        with:
          toolchain: 1.97.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          # 工具也固定版本（install-action 按它清单里的 sha256 校验下载的二进制）。
          tool: cargo-deny@0.20.2
      # 与 api/README.md 列出的命令相同；规则在 api/deny.toml。
      - name: cargo deny
        run: cargo deny --locked --all-features check advisories licenses bans sources

  web:
    name: 网站（web）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 静态检查
        run: npm run lint
      - name: 类型检查
        run: npm run typecheck
      - name: 格式
        run: npm run format:check
      - name: 测试
        run: npm test
      - name: 生产构建
        run: npm run build

  # 网站的端到端测试（Playwright，夹具模式：src/fixtures 回答公开接口，不需要后端）：
  # 三种视图、剖切、时间轴、现在模式、组合页、预览页、错误页、浅色主题、手机。
  # 无头 Chromium 用 SwiftShader 软件渲染 WebGL，不需要显卡。
  web-e2e:
    name: 网站端到端（web e2e）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      # 装锁文件里 @playwright/test 对应版本的 Chromium 和系统依赖（与 CMA 相同的写法）。
      - name: 安装 Chromium
        timeout-minutes: 10
        run: npx --no-install playwright install --with-deps chromium
      - name: 端到端测试
        run: npm run e2e
      - name: 失败时上传截图
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  # 本地重建工具（处理服务已下线）：只读写本地文件，测试不需要数据库。
  worker:
    name: 本地重建工具（worker）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.11.32
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      # 按 uv.lock 的锁定版本装（含开发依赖）；锁文件和 pyproject.toml 对不上时直接失败。
      - name: 安装（含开发依赖）
        run: uv sync --frozen --extra dev --python 3.13
      - name: 静态检查
        run: .venv/bin/ruff check .
      - name: 格式
        run: .venv/bin/ruff format --check .
      - name: 测试
        run: .venv/bin/pytest

  sdk-typescript:
    name: 命令行（sdk/typescript）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: 检查目录是否存在
        id: detect
        run: |
          if [[ -f sdk/typescript/package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "sdk/typescript 还不存在，跳过。"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
      - name: 安装依赖
        if: steps.detect.outputs.present == 'true'
        working-directory: sdk/typescript
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            echo "::error::sdk/typescript 缺少 package-lock.json，持续集成只用 npm ci 安装"
            exit 1
          fi
      # 与 sdk/typescript/README.md"开发"一节列出的完整检查一致。
      - name: 静态检查、类型检查、格式、测试、构建
        if: steps.detect.outputs.present == 'true'
        working-directory: sdk/typescript
        run: |
          npm run lint --if-present
          npm run typecheck --if-present
          npm run format:check --if-present
          npm test --if-present
          npm run build --if-present

  repo:
    name: 仓库检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false
      - name: 数据访问边界（不需要编译）
        run: bash .github/scripts/check-db-boundary.sh
      # 模拟 NyxID、九步验收脚本的小工具和参数检查（验收本身要起全套和前厅扫描，不在这里跑）。
      - name: 本地开发设施的测试
        run: node --test infra/dev/*.test.mjs
      - name: 部署规格检查（infra/chrono-cd/app.json）
        run: |
          node --test infra/chrono-cd/*.test.mjs
          node infra/chrono-cd/check-app.mjs
      # action 按提交哈希、基础镜像和构建前端按摘要固定；发布镜像不读共享的 Actions 缓存。
      - name: 供应链固定检查
        run: node infra/chrono-cd/check-pins.mjs
      - name: 本地开发设施：JSON 与脚本语法
        run: |
          node --check infra/dev/mock-nyxid.mjs
          node --check infra/dev/call.mjs
          node --check infra/dev/e2e.mjs
          node --check infra/dev/e2e-lib.mjs
          node -e 'for (const f of process.argv.slice(1)) JSON.parse(require("fs").readFileSync(f, "utf8"))' \
            infra/dev/org-roles.json infra/chrono-cd/app.json
      - name: shellcheck
        run: shellcheck infra/dev/*.sh .github/scripts/*.sh
      - name: hadolint（Dockerfile）
        run: |
          # GitHub 的发布下载偶尔返回 5xx，重试几次再判失败（校验和不变，重试不影响安全）。
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64
          echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" infra/api/Dockerfile infra/web/Dockerfile
      - name: actionlint（工作流）
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
