name: 发布与部署

# dev 发布测试镜像，main 发布正式镜像：
#   ghcr.io/chronoaiproject/chrono-metaverse-{api,web}
# （处理服务已下线，不再构建 worker 镜像；线上在换成瘦身后的版本之前仍按摘要跑以前构建的那个。）
# 标签：短提交哈希（7 位）、分支名；latest 只属于 main。
# 只构建 linux/amd64，按运行返回的摘要部署到分支对应的环境。
#
# main 和 latest 标签会随新构建移动，所以部署始终按本次运行返回的摘要固定。
# 任务检查 dev/main ref，并绑定相应环境的分支限制。
# 摘要交给 infra/chrono-cd/pin-images.mjs，不按标签查询摘要。

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch: {}

# 同一分支的镜像按推送顺序构建，不中途取消（避免分支标签指向半路被取消的那次之前的版本）。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: 发布前检查
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/ci.yml

  build:
    name: 镜像 ${{ matrix.image }}
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 构建身份
        id: build
        run: |
          echo "version=git-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 标签与标注
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/chronoaiproject/chrono-metaverse-${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 构建参数只有网站用（web/build/identity.ts 的构建身份）；接口服务的镜像忽略它们。
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          file: infra/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHRONO_BUILD=${{ steps.build.outputs.version }}
            CHRONO_BUILD_SHA=${{ github.sha }}
            CHRONO_BUILD_ARTIFACT=promotable
          # 单平台清单，不附加证明清单：这里返回的摘要就是 chrono-cd 按摘要拉取的那个清单。
          provenance: false
          # 不读写 Actions 缓存：缓存按仓库和分支共用、不分工作流，同一分支上任何一个 CI 任务里的
          # action（或它能拿到的缓存令牌）都能写进构建层，发布镜像会原样带上。每次从头构建
          # （runner 本来就是全新的，no-cache 只是写明这一点）。
          no-cache: true

      # 部署用的摘要：build-push-action 返回的就是推上去的清单摘要（单平台、不带证明清单，
      # 和 chrono-cd 解析出来的一致）。拿不到合法摘要时让运行失败，不给出没法用的结果。
      - name: 摘要
        env:
          NAME: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::没有拿到 chrono-metaverse-${NAME} 的镜像摘要（${DIGEST}）"
            exit 1
          fi
          {
            echo "### chrono-metaverse-${NAME}"
            echo
            echo "提交 \`${GITHUB_SHA}\`（分支 \`${GITHUB_REF_NAME}\`）。部署按摘要固定，把下面这行交给 \`infra/chrono-cd/pin-images.mjs\`："
            echo
            echo '```'
            echo "${NAME}=${DIGEST}"
            echo '```'
            echo
            echo "完整引用 \`ghcr.io/chronoaiproject/chrono-metaverse-${NAME}:${GITHUB_SHA::7}@${DIGEST}\`。标签可以被改写，只作记号："
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 保存本次构建摘要
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${IMAGE}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}.txt
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: 部署 ${{ github.ref_name == 'main' && '正式版' || '测试版' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://chrono-metaverse-prod-chronoai.apps.nyxid.ai' || 'https://chrono-metaverse-chronoai.apps.nyxid.ai' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: 按本次构建摘要部署并等待就绪
        env:
          DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          CHRONO_CD_API_KEY: ${{ secrets.CHRONO_CD_API_KEY }}
        run: node infra/chrono-cd/deploy.mjs digests
