name: 发布镜像（仅 main）

# 只有 main 可以构建并发布两个镜像到 ghcr.io：
#   ghcr.io/chronoaiproject/chrono-metaverse-{api,web}
# （处理服务已下线，不再构建 worker 镜像；线上在换成瘦身后的版本之前仍按摘要跑以前构建的那个。）
# 标签：短提交哈希（7 位）、main、latest。
# 只构建 linux/amd64（chrono-cd 的节点架构）。部署不在这里做，见 infra/chrono-cd/README.md。
#
# main 和 latest 标签会随新构建移动，所以部署始终按本次运行返回的摘要固定。
# 任务同时校验主线 ref 并使用仅允许 main 的 release 环境。
# 摘要交给 infra/chrono-cd/pin-images.mjs，不按标签查询摘要。

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# 同一分支的镜像按推送顺序构建，不中途取消（避免分支标签指向半路被取消的那次之前的版本）。
concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 镜像 ${{ matrix.image }}
    if: github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 构建身份
        id: build
        run: |
          echo "version=git-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 标签与标注
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/chronoaiproject/chrono-metaverse-${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 构建参数只有网站用（web/build/identity.ts 的构建身份）；接口服务的镜像忽略它们。
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          file: infra/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHRONO_BUILD=${{ steps.build.outputs.version }}
            CHRONO_BUILD_SHA=${{ github.sha }}
            CHRONO_BUILD_ARTIFACT=promotable
          # 单平台清单，不附加证明清单：这里返回的摘要就是 chrono-cd 按摘要拉取的那个清单。
          provenance: false
          # 不读写 Actions 缓存：缓存按仓库和分支共用、不分工作流，同一分支上任何一个 CI 任务里的
          # action（或它能拿到的缓存令牌）都能写进构建层，发布镜像会原样带上。每次从头构建
          # （runner 本来就是全新的，no-cache 只是写明这一点）。
          no-cache: true

      # 部署用的摘要：build-push-action 返回的就是推上去的清单摘要（单平台、不带证明清单，
      # 和 chrono-cd 解析出来的一致）。拿不到合法摘要时让运行失败，不给出没法用的结果。
      - name: 摘要
        env:
          NAME: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::没有拿到 chrono-metaverse-${NAME} 的镜像摘要（${DIGEST}）"
            exit 1
          fi
          {
            echo "### chrono-metaverse-${NAME}"
            echo
            echo "提交 \`${GITHUB_SHA}\`（分支 \`${GITHUB_REF_NAME}\`）。部署按摘要固定，把下面这行交给 \`infra/chrono-cd/pin-images.mjs\`："
            echo
            echo '```'
            echo "${NAME}=${DIGEST}"
            echo '```'
            echo
            echo "完整引用 \`ghcr.io/chronoaiproject/chrono-metaverse-${NAME}:${GITHUB_SHA::7}@${DIGEST}\`。标签可以被改写，只作记号："
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
