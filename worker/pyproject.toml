[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "metaverse-worker"
version = "0.1.0"
description = "chrono-metaverse 处理服务：上传校验、扫描对齐、结构重建、体素化、网页用模型、定期清理"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "pillow>=13,<14",
    "trimesh>=5.2,<6",
    "DracoPy>=2.2,<3",
    "pymongo>=4.19,<5",
    "fast-simplification>=0.2,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
]

[project.scripts]
metaverse-worker = "metaverse_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "mongo: 需要本地 MongoDB 副本集（METAVERSE_TEST_MONGODB_URI，默认 mongodb://127.0.0.1:27018/?replicaSet=rs0）",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 注释和文档字符串按项目约定用中文，全角标点是有意的。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
