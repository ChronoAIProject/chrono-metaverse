[package]
name = "metaverse-core"
version.workspace = true
edition.workspace = true
publish = false
description = "chrono-metaverse 的纯计算核心：数据模型、形状、区块编码、内容哈希、操作、回放、事件语义（无异步、无 IO）"

[dependencies]
flate2 = { workspace = true }
serde = { workspace = true }
# raw_value：重建包清单的记录先留原始片段，再逐条解析（不建整份清单的通用 JSON 树）。
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
